      - img "Editorial illustration of the Cascata Grande waterfall running through Isola del Liri, Italy" [ref=f17e255]
      - generic [ref=f17e257]:
        - heading "Where Is CHIAREL™ Made?" [level=2] [ref=f17e258]
        - paragraph [ref=f17e259]: "Before the Liri falls through Isola del Liri as the Cascata Grande, it is met by the Fibreno — a river fed entirely by limestone karst springs, with no surface tributaries of its own. That confluence, water arriving newly filtered rather than run off the surface, is what gives The Cascata Complex™ its name and its place: formulated here, with our manufacturing partner Natural You Srl, rather than sourced from a distance."
        - link "Read the Journal" [ref=f17e260] [cursor=pointer]:
          - /url: /journal/isola-del-liri-waterfall
    - generic [ref=f17e262]:
      - heading "Who Formulates CHIAREL™?" [level=2] [ref=f17e263]
      - paragraph [ref=f17e264]: Grazia Savoriti
      - paragraph [ref=f17e265]: Formulated by CHIAREL’s Pharmacist · Cosmetic & Nutraceutical Research
      - paragraph [ref=f17e266]: Every CHIAREL™ formulation is developed under her guidance and produced in small, fresh batches in Isola del Liri — made to order rather than held in standing inventory. The Cellular Intelligence Complex™ at the heart of CHIAREL Essence™ is formulated to support the skin’s own regulatory processes.
      - link "Explore the Science" [ref=f17e267] [cursor=pointer]:
        - /url: /science
      - link "Read her full bio →" [ref=f17e268] [cursor=pointer]:
        - /url: /house
      - link "Verified profile at Natural You Srl →" [ref=f17e269] [cursor=pointer]:
        - /url: https://www.naturalyou.it/about-us-detail/
    - generic [ref=f17e271]:
      - generic [ref=f17e272]:
        - heading "Backed by Published Research" [level=2] [ref=f17e273]
        - paragraph [ref=f17e274]: CHIAREL formulates with established, clinically studied ingredients — not novel, unstudied compounds. Each mechanism cited below is documented in peer-reviewed clinical and cosmetic-science literature, reviewed by our formulating pharmacist, not brand-authored claims.
      - list [ref=f17e275]:
        - listitem [ref=f17e276]:
          - paragraph [ref=f17e277]: Palmitoyl Pentapeptide-4 (used in CHIAREL Essence™) is studied for its role in visible firmness and texture support.
          - link "Published research, PubMed (NIH) →" [ref=f17e278] [cursor=pointer]:
            - /url: https://pubmed.ncbi.nlm.nih.gov/?term=palmitoyl+pentapeptide+skin
        - listitem [ref=f17e279]:
          - paragraph [ref=f17e280]: Ceramide NP and Niacinamide (used in Terra Radiance Crème™) are widely studied for barrier support and environmental defense.
          - link "Published research, PubMed (NIH) →" [ref=f17e281] [cursor=pointer]:
            - /url: https://pubmed.ncbi.nlm.nih.gov/?term=ceramide+niacinamide+skin+barrier
        - listitem [ref=f17e282]:
          - paragraph [ref=f17e283]: Bioactive Ferment Lysate — a postbiotic used across the ritual — is studied for supporting barrier proteins and microbiome balance. See the full mechanism explainer.
          - link "Read the formulation science →" [ref=f17e284] [cursor=pointer]:
            - /url: /science/bifida-ferment-lysate
        - listitem [ref=f17e285]:
          - paragraph [ref=f17e286]: L-Ornithine (used in Recovery Masque™) is studied for its role in the skin’s Natural Moisturizing Factor and overnight barrier repair.
          - link "Published research, PubMed (NIH) →" [ref=f17e287] [cursor=pointer]:
            - /url: https://pubmed.ncbi.nlm.nih.gov/?term=ornithine+skin+barrier
        - listitem [ref=f17e288]:
          - paragraph [ref=f17e289]: Low molecular weight Hyaluronic Acid (used in Cellular Mist™) is studied for fast-absorbing surface hydration ahead of treatment.
          - link "Published research, PubMed (NIH) →" [ref=f17e290] [cursor=pointer]:
            - /url: https://pubmed.ncbi.nlm.nih.gov/?term=low+molecular+weight+hyaluronic+acid+skin+hydration
      - paragraph [ref=f17e291]: N1 Neck & Décolleté Renewal Emulsion has no product-specific testing results published yet — see its product page for status.
    - generic [ref=f17e293]:
