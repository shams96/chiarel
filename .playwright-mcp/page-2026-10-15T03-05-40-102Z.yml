    - generic [ref=f3e201]:
      - generic [ref=f3e202]:
        - heading "Backed by Published Research" [level=2] [ref=f3e203]
        - paragraph [ref=f3e204]: CHIAREL formulates with established, clinically studied ingredients — not novel, unstudied compounds. Each mechanism cited below is documented in peer-reviewed clinical and cosmetic-science literature, reviewed by our formulating pharmacist, not brand-authored claims.
      - list [ref=f3e205]:
        - listitem [ref=f3e206]:
          - paragraph [ref=f3e207]: Palmitoyl Pentapeptide-4 (used in CHIAREL Essence™) is studied for its role in visible firmness and texture support.
          - link "Published research, PubMed (NIH) →" [ref=f3e208] [cursor=pointer]:
            - /url: https://pubmed.ncbi.nlm.nih.gov/?term=palmitoyl+pentapeptide+skin
        - listitem [ref=f3e209]:
          - paragraph [ref=f3e210]: Ceramide NP and Niacinamide (used in Terra Radiance Crème™) are widely studied for barrier support and environmental defense.
          - link "Published research, PubMed (NIH) →" [ref=f3e211] [cursor=pointer]:
            - /url: https://pubmed.ncbi.nlm.nih.gov/?term=ceramide+niacinamide+skin+barrier
        - listitem [ref=f3e212]:
          - paragraph [ref=f3e213]: Bioactive Ferment Lysate — a postbiotic used across the ritual — is studied for supporting barrier proteins and microbiome balance. See the full mechanism explainer.
          - link "Read the formulation science →" [ref=f3e214] [cursor=pointer]:
            - /url: /science/bifida-ferment-lysate
        - listitem [ref=f3e215]:
          - paragraph [ref=f3e216]: L-Ornithine (used in Recovery Masque™) is studied for its role in the skin’s Natural Moisturizing Factor and overnight barrier repair.
          - link "Published research, PubMed (NIH) →" [ref=f3e217] [cursor=pointer]:
            - /url: https://pubmed.ncbi.nlm.nih.gov/?term=ornithine+skin+barrier
        - listitem [ref=f3e218]:
          - paragraph [ref=f3e219]: Low molecular weight Hyaluronic Acid (used in Cellular Mist™) is studied for fast-absorbing surface hydration ahead of treatment.
          - link "Published research, PubMed (NIH) →" [ref=f3e220] [cursor=pointer]:
            - /url: https://pubmed.ncbi.nlm.nih.gov/?term=low+molecular+weight+hyaluronic+acid+skin+hydration
      - paragraph [ref=f3e221]: N1 Neck & Décolleté Renewal Emulsion has no product-specific testing results published yet — see its product page for status.
    - generic [ref=f3e223]:
      - heading "The Philosophy" [level=2] [ref=f3e224]
      - paragraph [ref=f3e225]: “Skin is not one thing. A house built to serve it should not pretend otherwise.”
      - paragraph [ref=f3e226]: "CHIAREL Intelligence™ began as a question at a kitchen table — the working method still holds: start with the biology in front of you, formulate it properly, and disclose exactly what went in. Advancing Cellular Clarity™ against Modern Biological Stress™ is the mission behind every formula, including N1. It is the same discipline behind La Bella Figura — presenting one’s best self, quietly, without announcement."
