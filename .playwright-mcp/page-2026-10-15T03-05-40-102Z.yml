      - generic [ref=f3e162]:
        - heading "Where Is CHIAREL™ Made?" [level=2] [ref=f3e163]
        - paragraph [ref=f3e164]: "Before the Liri falls through Isola del Liri as the Cascata Grande, it is met by the Fibreno — a river fed entirely by limestone karst springs, with no surface tributaries of its own. That confluence, water arriving newly filtered rather than run off the surface, is what gives The Cascata Complex™ its name and its place: formulated here, with our manufacturing partner Natural You Srl, rather than sourced from a distance."
        - link "Read the Journal" [ref=f3e165] [cursor=pointer]:
          - /url: /journal/isola-del-liri-waterfall
