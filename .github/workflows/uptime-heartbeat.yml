name: Uptime heartbeat

# Every 5 minutes: probe chiarel.com /api/health?db=1 (app + database); if it is down, open one issue and ask Hostinger to
# restart the Node app (at most once per 30 minutes). Logic lives in scripts/uptime-heartbeat.sh.
# GitHub may start scheduled runs a few minutes late, and disables scheduled workflows after 60 days
# without repository activity.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe, report and restart if down
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: bash scripts/uptime-heartbeat.sh
