  <!-- Water falling from the ridge through the gorge — the C's own
       terminal opening (top hook ~17.8, bottom hook ~78.0). Physically
       straight (gravity pulls straight down; no lateral force to wiggle
       it) and tapered wide-to-narrow top-to-bottom: by continuity
       (A·v = constant flow), the accelerating fall means cross-section
       must shrink as it descends. Two streams, not one, for two points
       along the ridge where water breaches. -->
  <path d="M58 26 C60.5 26 62 27.5 61.7 30 L58.8 60 C58.6 61.5 57.4 61.5 57.2 60 L54.3 30 C54 27.5 55.5 26 58 26 Z" fill="#D6C5A0" />
