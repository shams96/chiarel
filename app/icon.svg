<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ochre ground — distinct, saturated color reads at a glance in a tab
       strip full of blue/red app icons. -->
  <circle cx="50" cy="50" r="48" fill="#9B4722" />

  <!-- The "C" is the real Libre Bodoni glyph (weight 600 — the heaviest
       weight this brand actually uses, in app/layout.tsx's `serif` font
       config), not a generic geometric ring. Path extracted directly from
       the actual Libre Bodoni font file via fontTools and scaled into
       this viewBox — real brand typography, not an approximation. -->
